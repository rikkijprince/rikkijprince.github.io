<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.controls {
    margin-bottom: 20px;
    text-align: center;
}

select {
    padding: 8px;
    border-radius: 6px;
    border: none;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #1e293b;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #334155;
    text-align: left;
}

th {
    background: #020617;
}

tr:hover {
    background: #334155;
}

.badge {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
}

.basic_free { background: gray; }
.basic_paid { background: orange; }
.full_paid { background: green; }
.none { background: red; }

.error-message {
    color: #ef4444;
    padding: 12px;
    background: #7f1d1d;
    border-radius: 6px;
    margin-bottom: 20px;
    display: none;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #cbd5f5;
}

</style>

</head>
<body>

<h1>📊 Hybrid English Admin Dashboard</h1>

<div class="error-message" id="errorMessage"></div>

<div class="controls">
    Filter:
    <select id="statusFilter" onchange="filterUsers()">
        <option value="all">All</option>
        <option value="basic_free">Basic Free</option>
        <option value="basic_paid">Basic Paid</option>
        <option value="full_paid">Full Paid</option>
        <option value="none">Inactive</option>
    </select>
</div>

<div class="loading" id="loadingMessage">Loading users...</div>

<table id="usersTable" style="display: none;">
    <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Signup Date</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>

const API_URL = "/api/all_users";

let users = [];

async function loadUsers() {
    try {
        const response = await fetch(API_URL);
        
        if (!response.ok) {
            throw new Error(`API error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        users = data.users || [];
        renderUsers(users);
        
        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("usersTable").style.display = "table";
        document.getElementById("errorMessage").style.display = "none";
    } catch (error) {
        console.error("Failed to load users:", error);
        showError(`Failed to load users: ${error.message}`);
    }
}

function showError(message) {
    const errorDiv = document.getElementById("errorMessage");
    errorDiv.textContent = message;
    errorDiv.style.display = "block";
    document.getElementById("loadingMessage").style.display = "none";
    document.getElementById("usersTable").style.display = "none";
}

function renderUsers(data) {
    const tbody = document.querySelector("#usersTable tbody");
    
    // Build HTML string once instead of appending in loop
    const rows = data.map(user => {
        return `
            <tr>
                <td>${escapeHtml(user.username)}</td>
                <td>${escapeHtml(user.email)}</td>
                <td>${escapeHtml(user.phone || "")}</td>
                <td>${escapeHtml(user.signup_date)}</td>
                <td><span class="badge ${escapeHtml(user.status)}">${escapeHtml(user.status)}</span></td>
            </tr>
        `;
    }).join("");
    
    tbody.innerHTML = rows;
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function filterUsers() {
    const filter = document.getElementById("statusFilter").value;

    if (filter === "all") {
        renderUsers(users);
    } else {
        const filtered = users.filter(u => u.status === filter);
        renderUsers(filtered);
    }
}

loadUsers();

</script>

</body>
</html>
